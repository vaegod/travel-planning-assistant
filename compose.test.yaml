# Explicit integration override. No real AI key or external map/model calls.
services:
  fixture:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "scripts/eval-provider.mjs"]
    volumes:
      - ./scripts:/app/scripts:ro
      - ./eval:/app/eval:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 2s
      retries: 20
    mem_limit: 128m
  backend:
    environment:
      LLM_API_KEY: fixture-only-key
      LLM_MODEL: fixture-model
      LLM_BASE_URL: http://fixture:9000
      OVERPASS_URL: http://fixture:9000/places
      OSRM_URL: http://fixture:9000
      PLANNING_CACHE_TTL_SECONDS: 0
      EMBEDDING_MODEL: fixture-embedding
      EMBEDDING_BASE_URL: http://fixture:9000
      EMBEDDING_DIMENSIONS: 4
    depends_on:
      fixture:
        condition: service_healthy
